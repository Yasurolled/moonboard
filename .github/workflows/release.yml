name: Release MoonBoard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example, v2026.4.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager --install "platforms;android-34" "ndk;27.0.12077973"

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[0-9.]+' app/build.gradle)
          TAG_VERSION="${RELEASE_TAG#v}"
          if [[ "$TAG_VERSION" != "$VERSION_NAME" ]]; then
            echo "Tag $RELEASE_TAG does not match app versionName $VERSION_NAME" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" && -z "$ANDROID_KEYSTORE_PASSWORD" && -z "$ANDROID_KEY_ALIAS" && -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::warning::No signing secrets configured; the release APK will be unsigned."
            exit 0
          fi

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "All four Android signing secrets must be configured." >&2
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moonboard-release.keystore"
          if [[ ! -s "$RUNNER_TEMP/moonboard-release.keystore" ]]; then
            echo "Decoded signing keystore is empty." >&2
            exit 1
          fi
          echo "ORG_GRADLE_PROJECT_MOONBOARD_STORE_FILE=$RUNNER_TEMP/moonboard-release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_MOONBOARD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MOONBOARD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MOONBOARD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleVrModeRelease --no-daemon

      - name: Prepare APK for release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK_PATH="app/build/outputs/apk/vrMode/release/app-vrMode-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "Expected release APK not found: $APK_PATH" >&2
            exit 1
          fi
          cp "$APK_PATH" "MoonBoard-${RELEASE_TAG}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "MoonBoard ${RELEASE_TAG}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "MoonBoard-${RELEASE_TAG}.apk" --clobber
